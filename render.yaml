services:
  - type: web
    name: dream-extractor-bot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python3 run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_ID
        value: "-1003716177168"
      - key: PREMIUM_LOGS
        value: "-1003716177168"
      - key: MONGO_URL
        sync: false
